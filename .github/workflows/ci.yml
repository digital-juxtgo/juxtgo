name: JuxtGo CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: juxtgo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run database migrations
      - name: Run migrations
        env:
          SECRET_KEY: SECRET_KEY = config("DJANGO_SECRET_KEY")
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/juxtgo_test
        run: |
          python src/manage.py migrate

      # 5. Run tests (placeholder – you’ll add real tests later)
      - name: Run tests
        env:
          SECRET_KEY: SECRET_KEY = config("DJANGO_SECRET_KEY")
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/juxtgo_test
        run: |
          python src/manage.py test apps/

      # 6. Build Docker image
      - name: Build Docker image
        run: docker build -t juxtgo:latest -f docker/web/Dockerfile .

      # 7. (Optional) Push image to Docker Hub on tags
      # Uncomment and set secrets DOCKER_USERNAME and DOCKER_PASSWORD in your GitHub repo
      # - name: Login to Docker Hub
      #   if: startsWith(github.ref, 'refs/tags/')
      #   uses: docker/login-action@v2
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}
      #
      # - name: Push Docker image
      #   if: startsWith(github.ref, 'refs/tags/')
      #   run: docker push juxtgo:latest
