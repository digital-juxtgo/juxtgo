services:
  # ============================================================================
  # PostgreSQL Database Service
  # ============================================================================
  db:
    image: postgres:15

    container_name: juxtgo-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - juxtgo-network

  # ============================================================================
  # Django Application Service
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
        APP_USER: ${APP_USER}

    container_name: juxtgo-web

    restart: unless-stopped

    user: "${UID}:${GID}"

    command: >
      sh -c "
      /wait_for_db.sh &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

    volumes:
      - ./src:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    networks:
      - juxtgo-network

# ============================================================================
# Persistent Volumes
# ============================================================================
volumes:
  postgres_data:

# ============================================================================
# Networks
# ============================================================================
networks:
  juxtgo-network:
