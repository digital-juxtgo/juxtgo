version: "3.9"

services:
  # --------------------------------------------------
  # PostgreSQL
  # --------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: juxtgo-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - juxtgo-net

  # --------------------------------------------------
  # Django App (Gunicorn)
  # --------------------------------------------------
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.prod
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        APP_USER: ${APP_USER:-hadi}
    image: juxtgo-web:${VERSION:-latest}
    container_name: juxtgo-web-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - juxtgo-net

  # --------------------------------------------------
  # Nginx
  # --------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: juxtgo-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - ./infra/ssl:/etc/nginx/ssl:ro # We'll put certs here after generation
    depends_on:
      web:
        condition: service_healthy
    networks:
      - juxtgo-net

# --------------------------------------------------
# Volumes
# --------------------------------------------------
volumes:
  postgres_data:
  static_volume:
  media_volume:

# --------------------------------------------------
# Networks
# --------------------------------------------------
networks:
  juxtgo-net:
